name: Quality

on:
  push:
  pull_request:

jobs:
  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    steps:
      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install \
            git autoconf automake gcc make pkg-config \
            gettext-tools \
            libX11-devel \
            SDL3-devel SDL3_image-devel SDL3_ttf-devel SDL3_mixer-devel

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate autotools files
        run: ./autogen.sh

      - name: Configure (sanitizers)
        run: |
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fcommon" \
            ./configure --enable-sdl

      - name: Compile
        run: make -j"$(nproc)"

  clang-tidy:
    name: clang-tidy (changed files)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Determine changed C/H files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}" -- '*.c' '*.h' 2>/dev/null || true)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" | tr ' ' '\n' | while read -r f; do
            [ -f "$f" ] || continue
            clang-tidy "$f" -- -I. 2>&1 | tail -40
          done

  warnings-as-errors:
    name: Warnings as errors (tracking)
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    continue-on-error: true
    steps:
      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install \
            git autoconf automake gcc make pkg-config \
            gettext-tools \
            libX11-devel \
            SDL3-devel SDL3_image-devel SDL3_ttf-devel SDL3_mixer-devel

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate autotools files
        run: ./autogen.sh

      - name: Configure (warnings as errors)
        run: |
          CFLAGS="-O1 -g -Werror -fcommon" ./configure --enable-sdl

      - name: Compile
        run: make -j"$(nproc)"
